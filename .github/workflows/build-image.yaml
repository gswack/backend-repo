name: Pipeline 1 - Build

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build artifact
        run: npm install

      - name: Login to Nexus
        run: echo "${{ secrets.NEXUS_PASSWORD }}" | docker login localhost:8082 -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t localhost:8082/hotel-backend:${{ steps.tag.outputs.tag }} .

      - name: Push Docker image
        run: docker push localhost:8082/hotel-backend:${{ steps.tag.outputs.tag }}
