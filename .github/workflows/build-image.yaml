name: Pipeline 1 - Docker build and push

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        

      - name: Login to Nexus Docker Registry
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login "${{ secrets.NEXUS_REGISTRY }}" -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t "${{ secrets.NEXUS_REGISTRY }}/backend:dev" .

      - name: Push Docker image to Nexus
        run: docker push "${{ secrets.NEXUS_REGISTRY }}/backend:dev"

      - name: Verify image exists
        run: docker images | grep backend
